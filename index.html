<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#16665F" />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Swojus Palace"
    />
    <meta
      name="description"
      content="Swojus Palace - Event Management Dashboard"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <!-- Browser favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/app-icon.png"
    />
    <!-- iPhone / iPad Home Screen icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/app-icon.png"
    />
    <link
      rel="mask-icon"
      href="/app-icon.svg"
      color="#16665F"
    />
    <!-- PWA manifest -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />
    <title>Swojus Palace</title>
    <style>
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-live="polite" aria-label="Loading Swojus Palace">
      <div class="splash-logo-wrap">
        <img
          class="splash-logo"
          src="/app-icon.png"
          alt="Swojus Palace logo"
        />
      </div>
    </div>
    <div id="root"></div>
    <script
      type="module"
      src="/web-src/main.tsx"
    ></script>
  </body>
</html>
